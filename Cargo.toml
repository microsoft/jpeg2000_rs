[package]
name = "jpeg2000-decoder"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
description = "Memory-safe JPEG 2000 decoding with Verus verification"
readme = "README.md"
repository = "https://github.com/microsoft/jpeg2000_rs"
license = "MIT"
publish = false
include = [
    "Cargo.toml",
    "/LICENSE",
    "README.md",
    "RELEASING.md",
    "SECURITY.md",
    "THREAT_MODEL.md",
    "SUPPORTED.md",
    "PROOFS.md",
    "CONTRIBUTING.md",
    "REFERENCES.md",
    "THIRD_PARTY_NOTICES",
    "src/**/*.rs",
    "specs/**/*.rs",
    "specs/AUDIT_REFERENCE.md",
    "proofs/**/*.rs",
]

[features]
default = []
verus = ["dep:vstd"]

[dependencies]
vstd = { version = "=0.0.0-2026-10-04-0306", optional = true }

[package.metadata.verus]
verify = true

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(verus_keep_ghost)",
    "cfg(verus_only)",
] }

[lints.clippy]
all = "deny"
