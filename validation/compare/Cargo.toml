[package]
name = "jpeg2000-comparison"
version = "0.0.0"
edition = "2024"
rust-version = "1.93.1"
publish = false

[features]
default = ["hayro-jpeg2000/default"]
scalar = ["hayro-jpeg2000/std"]

[dependencies]
jpeg2000_rs = { path = "../.." }
hayro-jpeg2000 = { version = "=0.4.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
