name: Publish crate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed version tag at the selected release-branch head (for example v0.1.1)
        required: true
        type: string
      dry_run:
        description: Validate only; do not authenticate or upload
        required: true
        default: true
        type: boolean
      approved_commit:
        description: Owner-approved full source SHA (required for live publishing)
        required: false
        type: string
      approved_sha256:
        description: Owner-approved archive SHA256 from the dry-run receipt (required for live publishing)
        required: false
        type: string

permissions:
  contents: read

env:
  TAG_NAME: ${{ inputs.tag }}
  MODE: ${{ inputs.dry_run && 'dry-run' || 'publish' }}
  APPROVED_COMMIT: ${{ inputs.approved_commit }}
  APPROVED_SHA256: ${{ inputs.approved_sha256 }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      archive_sha256: ${{ steps.registry.outputs.archive_sha256 }}
      publish_needed: ${{ steps.registry.outputs.publish_needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Require a release-branch request and exact merged qualification
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp validation/check-release.py "$RUNNER_TEMP/check-release.py"
          cp validation/check-packaged-source.py "$RUNNER_TEMP/check-packaged-source.py"
          python -B "$RUNNER_TEMP/check-release.py" source --tag "$TAG_NAME" --mode "$MODE" \
            --approved-commit "$APPROVED_COMMIT" --approved-sha256 "$APPROVED_SHA256" \
            --wait-for-checks --output "$RUNNER_TEMP/release-source.json" --github-output "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.1
      - name: Build and rehearse the publication archive without registry credentials
        run: |
          cargo +1.98.1 package -p jpeg2000-decoder --locked
          cargo +1.98.1 publish -p jpeg2000-decoder --dry-run --locked --registry crates-io
      - name: Require the exact CI-qualified archive and check registry state
        id: registry
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.source.outputs.commit }}
          QUALIFIED_RUN: ${{ steps.source.outputs.verus_run_id }}
        run: |
          python -B "$RUNNER_TEMP/check-release.py" archive --tag "$TAG_NAME" --mode "$MODE" \
            --commit "$COMMIT" --qualified-run "$QUALIFIED_RUN" \
            --approved-commit "$APPROVED_COMMIT" --approved-sha256 "$APPROVED_SHA256" \
            --output target/release-validation/registry.json --github-output "$GITHUB_OUTPUT"
          cp "$RUNNER_TEMP/release-source.json" target/release-validation/source.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/release-validation/
          if-no-files-found: error

  publish:
    needs: validate
    if: github.repository == 'microsoft/jpeg2000_rs' && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/release/') && inputs.dry_run == false && needs.validate.outputs.publish_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crates-io
    concurrency:
      group: crates-io-jpeg2000-decoder
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      id-token: write
    env:
      COMMIT: ${{ needs.validate.outputs.commit }}
      ARCHIVE_SHA256: ${{ needs.validate.outputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve the reviewed validation helpers
        run: |
          cp validation/check-release.py "$RUNNER_TEMP/check-release.py"
          cp validation/check-packaged-source.py "$RUNNER_TEMP/check-packaged-source.py"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Recheck qualification after environment approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -B "$RUNNER_TEMP/check-release.py" source --tag "$TAG_NAME" --mode publish
          --approved-commit "$COMMIT" --approved-sha256 "$ARCHIVE_SHA256"
          --output "$RUNNER_TEMP/release-source-recheck.json"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.1
      - name: Reproduce the exact approved archive
        run: cargo +1.98.1 package -p jpeg2000-decoder --locked
      - name: Recheck tag, source, archive and registry before authentication
        id: recheck
        run: >-
          python -B "$RUNNER_TEMP/check-release.py" archive --tag "$TAG_NAME" --mode publish
          --commit "$COMMIT" --approved-commit "$COMMIT" --approved-sha256 "$ARCHIVE_SHA256"
          --output target/release-publication/candidate.json --github-output "$GITHUB_OUTPUT"
      - name: Authenticate with crates.io Trusted Publishing
        id: auth
        if: steps.recheck.outputs.publish_needed == 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9
      - name: Publish only the approved release archive
        if: steps.recheck.outputs.publish_needed == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: >-
          cargo +1.98.1 --config 'registry.global-credential-providers=["cargo:token"]'
          --config 'registries.crates-io.index="sparse+https://index.crates.io/"'
          publish -p jpeg2000-decoder --locked --registry crates-io
      - name: Verify the registry download and a fresh exact-version consumer
        run: >-
          python -B "$RUNNER_TEMP/check-release.py" archive --tag "$TAG_NAME" --mode publish
          --commit "$COMMIT" --approved-commit "$COMMIT" --approved-sha256 "$ARCHIVE_SHA256"
          --verify-published --output target/release-publication/registry.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/release-publication/
          if-no-files-found: error
