name: CI

on:
  push:
    branches:
      - main
      - release/*
  pull_request:
  workflow_dispatch:
    inputs:
      consumer_benchmark:
        description: Run optional issue 449 native final-consumer benchmark (no publication)
        required: false
        type: boolean
        default: false
      consumer_benchmark_pairs:
        description: Opposite-order process pairs per tuning/fixture/backend
        required: false
        type: choice
        default: '4'
        options:
          - '2'
          - '4'
          - '6'
      consumer_benchmark_scope:
        description: Standalone study or supplied actual zune consumer
        required: false
        type: choice
        default: standalone
        options:
          - standalone
          - zune

permissions:
  contents: read

jobs:
  consumer-benchmark:
    name: Optional consumer tuning (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.consumer_benchmark && inputs.consumer_benchmark_scope == 'standalone'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Pin final consumer compiler
        run: rustup toolchain install 1.93.1 --profile minimal
      - name: Prepare and verify identical frozen public inputs
        run: |
          python3 validation/consumer-tuning/generate_fixtures.py
          python3 -m unittest discover -s validation/consumer-tuning -p 'test_*.py' -v
      - name: Measure native final consuming binaries
        env:
          PAIRS: ${{ inputs.consumer_benchmark_pairs }}
        run: |
          python3 validation/consumer-tuning/run.py \
            --pairs "$PAIRS" --output target/consumer-tuning/results
      - name: Preserve every raw build, process, outcome and hardware observation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consumer-tuning-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/consumer-tuning
          retention-days: 30
          if-no-files-found: error

  zune-consumer-fixtures:
    name: Verify supplied historical zune inputs
    if: github.event_name == 'workflow_dispatch' && inputs.consumer_benchmark && inputs.consumer_benchmark_scope == 'zune'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reproduce the exact historical Pillow/OpenJPEG cohort once
        shell: bash
        run: |
          HANDOFF="$GITHUB_WORKSPACE/validation/consumer-tuning/zune-handoff"
          python3 -m venv "$RUNNER_TEMP/zune-generator-tools"
          "$RUNNER_TEMP/zune-generator-tools/bin/python" -m pip install -r "$HANDOFF/tooling-requirements.txt"
          export UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/zune-python"
          UV="$RUNNER_TEMP/zune-generator-tools/bin/uv"
          "$UV" python install 3.12.16
          "$UV" venv --python 3.12.16 "$RUNNER_TEMP/zune-generator"
          "$UV" pip install --python "$RUNNER_TEMP/zune-generator/bin/python" -r "$HANDOFF/requirements.txt"
          "$RUNNER_TEMP/zune-generator/bin/python" -c 'import sys; from PIL import __version__, features; assert sys.version_info[:3] == (3,12,16) and __version__ == "12.0.0" and features.version("jpg_2000") == "2.5.4"'
          mkdir -p target/consumer-integration/fixture-work/target target/consumer-integration/fixtures
          cd target/consumer-integration/fixture-work
          "$RUNNER_TEMP/zune-generator/bin/python" "$HANDOFF/generate.py"
          cp target/generated/1024-*.jp2 target/generated/1024-*.ref ../fixtures/
          cd ../fixtures
          sha256sum -c "$HANDOFF/SHA256SUMS"
      - name: Check actual-consumer protocol guards
        run: python3 -m unittest discover -s validation/consumer-tuning -p 'test_zune_integration.py' -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: consumer-zune-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/consumer-integration/fixtures
          retention-days: 30
          if-no-files-found: error

  zune-consumer-benchmark:
    name: Actual zune consumer (${{ matrix.os }})
    needs: zune-consumer-fixtures
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: consumer-zune-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/consumer-integration/fixtures
      - name: Pin native final-consumer compiler
        run: rustup toolchain install 1.93.1 --profile minimal
      - name: Prepare only the supplied clean integration
        run: |
          python3 validation/consumer-tuning/zune_integration.py prepare \
            --work-root target/consumer-integration/work
      - name: Qualify actual final consuming builds
        env:
          PAIRS: ${{ inputs.consumer_benchmark_pairs }}
        run: |
          python3 validation/consumer-tuning/zune_integration.py run \
            --work-root target/consumer-integration/work \
            --fixtures target/consumer-integration/fixtures \
            --output target/consumer-integration/results --pairs "$PAIRS"
      - name: Preserve actual-consumer build, pixel and timing evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: actual-zune-consumer-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/consumer-integration/results
            target/consumer-integration/fixtures
          retention-days: 30
          if-no-files-found: error

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: cargo test --all-targets --locked
      - run: cargo test --all-targets --features cooperative-deadlines,pdf-mq-recovery,incremental-input --locked
      - run: cargo test --lib --features incremental-input incremental::tests --locked
      - run: cargo test --doc --locked
      - run: cargo check --release --all-targets --locked

  msrv:
    name: Minimum supported Rust (1.88.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 test --no-default-features --all-targets --locked
      - run: cargo +1.88.0 test --no-default-features --all-targets --features cooperative-deadlines,pdf-mq-recovery,incremental-input --locked
      - run: cargo +1.88.0 test --no-default-features --lib --features incremental-input incremental::tests --locked
      - run: cargo +1.88.0 test --no-default-features --doc --locked
      - run: cargo +1.88.0 check --no-default-features --release --all-targets --locked

  quality:
    name: Quality and package audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check fuzz harnesses and bounded resource profile
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
          cargo check --manifest-path fuzz/Cargo.toml --all-targets --locked
          cargo test --manifest-path fuzz/Cargo.toml --lib --locked
      - name: Audit package contents
        shell: bash
        run: diff -u validation/expected-package-files.txt <(cargo package --list --locked)
      - name: Verify packaged decoder builds
        run: cargo package --locked
      - name: Check image consumer against the unpacked package
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/image-consumer-probe
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 test --locked --manifest-path validation/image-consumer-probe/Cargo.toml
          cargo +1.88.0 check --release --all-targets --locked --manifest-path validation/image-consumer-probe/Cargo.toml
          cargo fmt --manifest-path validation/image-consumer-probe/Cargo.toml --package jpeg2000_image_consumer_probe -- --check
          cargo clippy --all-targets --locked --manifest-path validation/image-consumer-probe/Cargo.toml -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked --manifest-path validation/image-consumer-probe/Cargo.toml
          git diff --exit-code

  native-numerics:
    name: Native numerical (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
            venv: .venv/bin/python
          - os: macos-latest
            python: python3
            venv: .venv/bin/python
          - os: windows-latest
            python: python
            venv: .venv/Scripts/python.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Initialize the pinned crate toolchain
        run: |
          cargo --version
          rustc --version
      - name: Install pinned validation dependencies
        run: |
          ${{ matrix.python }} -m venv .venv
          ${{ matrix.venv }} --version
          ${{ matrix.venv }} -m pip --version
          ${{ matrix.venv }} -m pip install --require-hashes --only-binary=:all: -r validation/requirements.txt
      - name: Build pinned independent reference tools
        run: |
          bash validation/build-openjpeg.sh
          bash validation/build-openjph.sh
      - name: Locate native reference executables
        run: |
          ${{ matrix.venv }} - <<'PY'
          import os
          from pathlib import Path
          suffix = ".exe" if os.name == "nt" else ""
          projects = {
              "OPENJPEG_ENCODER": ("openjpeg-build", "opj_compress"),
              "OPENJPEG_DECODER": ("openjpeg-build", "opj_decompress"),
              "OPENJPH_ENCODER": ("openjph-build", "ojph_compress"),
              "OPENJPH_DECODER": ("openjph-build", "ojph_expand"),
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env, \
               open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as paths:
              for variable, (project, program) in projects.items():
                  candidates = [path for path in (Path("target/validation/oracles") / project).rglob(program + suffix)
                                if path.is_file()]
                  if len(candidates) != 1:
                      raise RuntimeError(f"expected one native executable for {variable}: {candidates}")
                  executable = candidates[0].resolve()
                  print(f"{variable}={executable}", file=env)
                  print(executable.parent, file=paths)
          PY
      - name: Bounded subprocess regression tests
        run: ${{ matrix.venv }} -m unittest -v validation.tests.test_processes
      - name: Independent legacy numerical checks
        run: ${{ matrix.venv }} validation/run-validation.py numerical
      - name: Independent HT numerical checks
        run: ${{ matrix.venv }} validation/run-validation.py htj2k
      - name: Native numerical, selection and container regressions
        run: |
          ${{ matrix.venv }} -m unittest -v \
            validation.tests.test_numerical \
            validation.tests.test_selection \
            validation.tests.test_container_relations
      - name: Verify reports and unchanged tracked source
        run: |
          ${{ matrix.venv }} validation/run-validation.py schemas
          git diff --exit-code
      - name: Upload platform numerical reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-numerics-${{ matrix.os }}
          path: |
            target/validation/numerical-results.json
            target/validation/htj2k-results.json
            target/validation/numerical-failures/**
            target/validation/selection-failures/**
            target/validation/container-failures/**
            target/validation/q2-selection/**
            target/validation/q2-container/**
            target/validation/q2-mixed/**
          if-no-files-found: warn
          retention-days: 14

  decoder-validation:
    name: Generated decoder validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Initialize pinned crate toolchain
        env:
          RUSTUP_HOME: ${{ runner.temp }}/jpeg2000-validation-rustup
        run: |
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          cargo --version
          rustc --version
      - name: Install pinned validation dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r validation/requirements.txt
      - name: Build pinned independent legacy reference tools
        run: |
          bash validation/build-openjpeg.sh
          echo "$GITHUB_WORKSPACE/target/validation/oracles/openjpeg-build/bin" >> "$GITHUB_PATH"
          if [ ! -x /usr/bin/time ]; then
            echo "GNU Time is required for canonical resource validation" >&2
            exit 1
          fi
          /usr/bin/time --version
      - name: Build pinned independent HTJ2K reference tools
        run: |
          bash validation/build-openjph.sh
          echo "$GITHUB_WORKSPACE/target/validation/oracles/openjph-build/src/apps/ojph_compress" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/target/validation/oracles/openjph-build/src/apps/ojph_expand" >> "$GITHUB_PATH"
      - name: Framework regression tests
        run: .venv/bin/python -m unittest discover -s validation/tests -v
        env:
          PYTHONPATH: validation
      - run: .venv/bin/python validation/run-validation.py generate --check
      - run: .venv/bin/python validation/run-validation.py verify
      - run: .venv/bin/python validation/run-validation.py inventory
      - run: .venv/bin/python validation/run-validation.py schemas
      - run: .venv/bin/python validation/run-validation.py all
      - run: .venv/bin/python validation/run-validation.py htj2k
      - run: .venv/bin/python validation/run-validation.py resources
      - name: Check validation did not modify tracked source
        run: git diff --exit-code
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: decoder-validation
          path: |
            target/validation/*.json
            target/validation/numerical-failures/**
            target/validation/selection-failures/**
            target/validation/container-failures/**
            target/validation/resource-failures/**
            target/validation/q2-selection/**
            target/validation/q2-container/**
            target/validation/q2-mixed/**
          if-no-files-found: warn
          retention-days: 14
