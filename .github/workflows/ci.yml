name: CI

on:
  push:
    branches:
      - main
      - release/*
  pull_request:
  workflow_dispatch:
    inputs:
      consumer_benchmark:
        description: Run an optional performance study (no publication)
        required: false
        type: boolean
        default: false
      consumer_benchmark_pairs:
        description: Opposite-order process pairs per tuning/fixture/backend
        required: false
        type: choice
        default: '4'
        options:
          - '2'
          - '4'
          - '6'
      consumer_benchmark_scope:
        description: Standalone study, native revision comparison, or supplied actual consumer
        required: false
        type: choice
        default: standalone
        options:
          - standalone
          - zune
          - pdfium
          - zune-acceptance
          - native-comparison
          - uncovered-evaluation
          - uncovered-instructions
          - uncovered-candidate
      consumer_evidence_run:
        description: Prior actual-zune run for fixed-corpus artifact execution
        required: false
        type: string
        default: ''
      native_baseline:
        description: Same-repository baseline commit (40 lowercase hex; native-comparison only)
        type: string
      native_candidate:
        description: Same-repository candidate commit (40 lowercase hex; native-comparison or uncovered-candidate)
        type: string
      uncovered_case:
        description: Case regex for an uncovered-candidate confirmation (default is the full 57-case cohort)
        type: string
        default: '^(?!roi8k|day-large)'
      native_pairs:
        description: Paired fresh processes per case (native-comparison only)
        type: choice
        default: '8'
        options:
          - '8'
          - '24'

permissions:
  contents: read

jobs:
  uncovered-evaluation:
    name: Optional uncovered evaluation (native x86-64)
    if: github.event_name == 'workflow_dispatch' && inputs.consumer_benchmark && (inputs.consumer_benchmark_scope == 'uncovered-evaluation' || inputs.consumer_benchmark_scope == 'uncovered-instructions' || inputs.consumer_benchmark_scope == 'uncovered-candidate')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: evaluation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: decoder
          ref: f4b2b7b29d38fa31bd74263913462bb67d6e5e4e
          persist-credentials: false
      - name: Validate opt-in candidate revision
        if: inputs.consumer_benchmark_scope == 'uncovered-candidate'
        env:
          CANDIDATE: ${{ inputs.native_candidate }}
          CASE: ${{ inputs.uncovered_case }}
        run: |
          python3 -c 'import os,re; value=os.environ["CANDIDATE"]; assert re.fullmatch("[0-9a-f]{40}",value), "candidate must be a complete lowercase commit SHA"; assert os.environ["CASE"], "case regex must not be empty"; re.compile(os.environ["CASE"])'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: inputs.consumer_benchmark_scope == 'uncovered-candidate'
        with:
          path: candidate-decoder
          ref: ${{ inputs.native_candidate }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Pin compiler and image preparation
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          python3 -m pip install -r evaluation/tools/bench-vs-openjpeg/requirements-corpus.txt
          python3 -m unittest discover -s evaluation/tools/bench-vs-openjpeg -p 'test_*.py' -v
      - name: Build pinned reference encoder
        env:
          WORK: ${{ runner.temp }}/uncovered-evaluation
        run: |
          mkdir -p "$WORK"
          lscpu > "$WORK/hardware.stdout"
          cp /etc/os-release "$WORK/os.stdout"
          if ! valgrind --version > "$WORK/valgrind-probe.stdout" 2> "$WORK/valgrind-probe.stderr"; then
            sudo apt-get update
            sudo apt-get install -y valgrind
          fi
          ldd --version > "$WORK/libc.stdout"
          git clone --depth 1 --branch v2.5.4 https://github.com/uclouvain/openjpeg.git "$RUNNER_TEMP/openjpeg254"
          test "$(git -C "$RUNNER_TEMP/openjpeg254" rev-parse HEAD)" = 6c4a29b00211eb0430fa0e5e890f1ce5c80f409f
          cmake -S "$RUNNER_TEMP/openjpeg254" -B "$RUNNER_TEMP/encoder254" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DBUILD_CODEC=ON \
            -DBUILD_TESTING=OFF -DBUILD_JPIP=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            "-DCMAKE_C_FLAGS_RELEASE=-O3 -DNDEBUG -ffp-contract=off -march=x86-64" \
            -DCMAKE_DISABLE_FIND_PACKAGE_PNG=TRUE -DCMAKE_DISABLE_FIND_PACKAGE_TIFF=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_LCMS2=TRUE -DCMAKE_DISABLE_FIND_PACKAGE_LCMS=TRUE
          cmake --build "$RUNNER_TEMP/encoder254" --parallel 2 --target opj_compress
      - name: Prepare canonical x86 corpus and measure declared small-image scope
        env:
          WORK: ${{ runner.temp }}/uncovered-evaluation
          RUSTUP_TOOLCHAIN: 1.93.1
          STUDY: ${{ inputs.consumer_benchmark_scope }}
          CANDIDATE: ${{ inputs.native_candidate }}
          CASE: ${{ inputs.uncovered_case }}
        run: |
          TOOL="$GITHUB_WORKSPACE/evaluation/tools/bench-vs-openjpeg"
          test "$(git -C decoder rev-parse HEAD)" = f4b2b7b29d38fa31bd74263913462bb67d6e5e4e
          python3 "$TOOL/corpus.py" --output "$WORK/corpus" --assets "$TOOL/assets" \
            --encoder "$RUNNER_TEMP/encoder254/bin/opj_compress"
          CPU=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          if [ "$STUDY" = uncovered-candidate ]; then
            test "$(git -C candidate-decoder rev-parse HEAD)" = "$CANDIDATE"
            python3 "$TOOL/run.py" --output "$WORK/build-check" \
              --openjpeg-source "$RUNNER_TEMP/openjpeg254" --decoder-source "$GITHUB_WORKSPACE/decoder" \
              --corpus-manifest "$WORK/corpus/manifest.json" --cpu "$CPU" \
              --configs generic,x86-64-v3 --case "$CASE" \
              --iterations 2 --minimum-ms 0 --warmups 0
            python3 "$TOOL/compare.py" --baseline "$WORK/build-check" \
              --candidate-source "$GITHUB_WORKSPACE/candidate-decoder" \
              --output "$WORK/paired" --configs generic,x86-64-v3 --cpu "$CPU"
            objdump -d -C "$WORK/paired/x86-64-v3/cargo/release/bench-vs-openjpeg" \
              > "$WORK/x86-64-v3-candidate-final.asm"
            objdump -d -C "$WORK/build-check/x86-64-v3/cargo/release/bench-vs-openjpeg" \
              > "$WORK/x86-64-v3-baseline-final.asm"
            python3 "$TOOL/count_variant.py" --comparison "$WORK/paired" \
              --baseline "$WORK/build-check" --output "$WORK/candidate-counters" \
              --counter-backend callgrind --cpu "$CPU"
            printf 'Paired generic/v3 candidate study, case regex: %s. Short control build-check timings are not speed evidence; paired timings use the full protocol.\n' "$CASE" \
              > "$WORK/SCOPE.txt"
            exit 0
          fi
          if [ "$STUDY" = uncovered-instructions ]; then
            python3 "$TOOL/run.py" --output "$WORK/timings" \
              --openjpeg-source "$RUNNER_TEMP/openjpeg254" --decoder-source "$GITHUB_WORKSPACE/decoder" \
              --corpus-manifest "$WORK/corpus/manifest.json" --cpu "$CPU" \
              --configs generic,consumer,x86-64-v3,native \
              --case '^(day-small-gray-lossless|day-small-gray-lossy-r40|style-b32-m0|structure-untiled)$' \
              --iterations 1 --minimum-ms 0 --warmups 0
            python3 "$TOOL/instructions.py" --baseline "$WORK/timings" \
              --output "$WORK/instructions" --cpu "$CPU"
            echo "Instrumented representative A-D process counts; shortened build-check timings are not speed evidence." \
              > "$WORK/SCOPE.txt"
            exit 0
          fi
          python3 "$TOOL/run.py" --output "$WORK/timings" \
            --openjpeg-source "$RUNNER_TEMP/openjpeg254" --decoder-source "$GITHUB_WORKSPACE/decoder" \
            --corpus-manifest "$WORK/corpus/manifest.json" \
            --configs generic,consumer,x86-64-v3,native --case '^(?!roi8k|day-large)' --cpu "$CPU"
          objdump -d -C "$WORK/timings/x86-64-v3/cargo/release/bench-vs-openjpeg" \
            > "$WORK/x86-64-v3-final.asm"
          echo "This hosted scope excludes large/8K cases; canonical input hashes must match before cross-host pooling." \
            > "$WORK/SCOPE.txt"
          python3 "$TOOL/instructions.py" --baseline "$WORK/timings" \
            --output "$WORK/instructions" --cpu "$CPU"
      - name: Collect raw observations, canonical inputs and disassembly
        if: always()
        env:
          WORK: ${{ runner.temp }}/uncovered-evaluation
        run: |
          python3 evaluation/tools/bench-vs-openjpeg/collect.py \
            --work "$WORK" --output "$RUNNER_TEMP/uncovered-evidence"
      - name: Preserve exact corpus and all outcomes, including partial failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: uncovered-x86-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/uncovered-evidence
          retention-days: 30
          if-no-files-found: error

  consumer-benchmark:
    name: Optional consumer tuning (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.consumer_benchmark && inputs.consumer_benchmark_scope == 'standalone'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Pin final consumer compiler
        run: rustup toolchain install 1.93.1 --profile minimal
      - name: Prepare and verify identical frozen public inputs
        run: |
          python3 validation/consumer-tuning/generate_fixtures.py
          python3 -m unittest discover -s validation/consumer-tuning -p 'test_*.py' -v
      - name: Measure native final consuming binaries
        env:
          PAIRS: ${{ inputs.consumer_benchmark_pairs }}
        run: |
          python3 validation/consumer-tuning/run.py \
            --pairs "$PAIRS" --output target/consumer-tuning/results
      - name: Preserve every raw build, process, outcome and hardware observation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consumer-tuning-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/consumer-tuning
          retention-days: 30
          if-no-files-found: error

  native-candidate-comparison:
    name: Focused native revision comparison (${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch' && inputs.consumer_benchmark && inputs.consumer_benchmark_scope == 'native-comparison'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Validate opt-in revision and pairing inputs
        env:
          BASELINE: ${{ inputs.native_baseline }}
          CANDIDATE: ${{ inputs.native_candidate }}
          PAIRS: ${{ inputs.native_pairs }}
          ARCH: ${{ matrix.arch }}
        run: |
          python3 validation/consumer-tuning/native_comparison.py \
            --baseline "$BASELINE" --candidate "$CANDIDATE" --pairs "$PAIRS" \
            --arch "$ARCH" --output target/native-comparison --validate-inputs
      - name: Pin native final consumer compiler and check driver guards
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          python3 -m unittest discover -s validation/consumer-tuning -p 'test_native_comparison.py' -v
      - name: Qualify native output, then measure paired consumers
        env:
          BASELINE: ${{ inputs.native_baseline }}
          CANDIDATE: ${{ inputs.native_candidate }}
          PAIRS: ${{ inputs.native_pairs }}
          ARCH: ${{ matrix.arch }}
        run: |
          python3 validation/consumer-tuning/native_comparison.py \
            --baseline "$BASELINE" --candidate "$CANDIDATE" --pairs "$PAIRS" \
            --arch "$ARCH" --output target/native-comparison
      - name: Preserve focused raw qualification and process evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-comparison-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/native-comparison/evidence
          retention-days: 30
          if-no-files-found: warn

  zune-consumer-fixtures:
    name: Verify supplied historical zune inputs
    if: github.event_name == 'workflow_dispatch' && inputs.consumer_benchmark && inputs.consumer_benchmark_scope == 'zune'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reproduce the exact historical Pillow/OpenJPEG cohort once
        shell: bash
        run: |
          HANDOFF="$GITHUB_WORKSPACE/validation/consumer-tuning/zune-handoff"
          python3 -m venv "$RUNNER_TEMP/zune-generator-tools"
          "$RUNNER_TEMP/zune-generator-tools/bin/python" -m pip install -r "$HANDOFF/tooling-requirements.txt"
          export UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/zune-python"
          UV="$RUNNER_TEMP/zune-generator-tools/bin/uv"
          "$UV" python install 3.12.16
          "$UV" venv --python 3.12.16 "$RUNNER_TEMP/zune-generator"
          "$UV" pip install --python "$RUNNER_TEMP/zune-generator/bin/python" -r "$HANDOFF/requirements.txt"
          "$RUNNER_TEMP/zune-generator/bin/python" -c 'import sys; from PIL import __version__, features; assert sys.version_info[:3] == (3,12,16) and __version__ == "12.0.0" and features.version("jpg_2000") == "2.5.4"'
          mkdir -p target/consumer-integration/fixture-work/target target/consumer-integration/fixtures
          cd target/consumer-integration/fixture-work
          "$RUNNER_TEMP/zune-generator/bin/python" "$HANDOFF/generate.py"
          cp target/generated/1024-*.jp2 target/generated/1024-*.ref ../fixtures/
          cd ../fixtures
          sha256sum -c "$HANDOFF/SHA256SUMS"
      - name: Check actual-consumer protocol guards
        run: python3 -m unittest discover -s validation/consumer-tuning -p 'test_zune_integration.py' -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: consumer-zune-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/consumer-integration/fixtures
          retention-days: 30
          if-no-files-found: error

  zune-consumer-benchmark:
    name: Actual zune consumer (${{ matrix.os }})
    needs: zune-consumer-fixtures
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: consumer-zune-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/consumer-integration/fixtures
      - name: Pin native final-consumer compiler
        run: rustup toolchain install 1.93.1 --profile minimal
      - name: Prepare only the supplied clean integration
        run: |
          python3 validation/consumer-tuning/zune_integration.py prepare \
            --work-root "$RUNNER_TEMP/zune-consumer"
      - name: Qualify actual final consuming builds
        env:
          PAIRS: ${{ inputs.consumer_benchmark_pairs }}
        run: |
          python3 validation/consumer-tuning/zune_integration.py run \
            --work-root "$RUNNER_TEMP/zune-consumer" \
            --fixtures target/consumer-integration/fixtures \
            --output target/consumer-integration/results --pairs "$PAIRS"
      - name: Preserve actual-consumer build, pixel and timing evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: actual-zune-consumer-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/consumer-integration/results
            target/consumer-integration/fixtures
          retention-days: 30
          if-no-files-found: error

  pdfium-consumer-benchmark:
    name: Actual PDFium direct backend
    if: github.event_name == 'workflow_dispatch' && inputs.consumer_benchmark && inputs.consumer_benchmark_scope == 'pdfium'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check pinned source-roll guards
        run: python3 -m unittest discover -s validation/consumer-tuning -p 'test_pdfium_integration.py' -v
      - name: Prepare exact public CL and published decoder
        run: |
          mkdir -p target/consumer-pdfium
          python3 validation/consumer-tuning/pdfium_integration.py prepare \
            --work-root "$RUNNER_TEMP/pdfium-consumer" \
            > target/consumer-pdfium/prepare.log 2>&1
      - name: Build matched optimized GN consumers and retain pixel parity
        run: |
          python3 validation/consumer-tuning/pdfium_integration.py run \
            --work-root "$RUNNER_TEMP/pdfium-consumer" \
            --output target/consumer-pdfium/results
      - name: Preserve actual GN commands, tests, pixels and timing
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: actual-pdfium-consumer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/consumer-pdfium/results
            target/consumer-pdfium/prepare.log
          retention-days: 30
          if-no-files-found: warn

  zune-consumer-acceptance:
    name: Actual zune fixed-corpus acceptance (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.consumer_benchmark && inputs.consumer_benchmark_scope == 'zune-acceptance'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: actual-zune-consumer-${{ matrix.os }}-${{ inputs.consumer_evidence_run }}-1
          run-id: ${{ inputs.consumer_evidence_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: target/actual-zune-artifact
      - run: rustup toolchain install 1.93.1 --profile minimal
      - name: Preserve strict and lenient outcomes of unchanged binaries
        run: |
          python3 validation/consumer-tuning/zune_acceptance.py \
            --artifacts target/actual-zune-artifact \
            --output target/consumer-acceptance/results
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: actual-zune-acceptance-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/consumer-acceptance/results
          retention-days: 30
          if-no-files-found: warn

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: cargo test --all-targets --locked
      - run: cargo test --all-targets --features cooperative-deadlines,pdf-mq-recovery,incremental-input --locked
      - run: cargo test --lib --features incremental-input incremental::tests --locked
      - run: cargo test --doc --locked
      - run: cargo check --release --all-targets --locked

  msrv:
    name: Minimum supported Rust (1.88.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 test --no-default-features --all-targets --locked
      - run: cargo +1.88.0 test --no-default-features --all-targets --features cooperative-deadlines,pdf-mq-recovery,incremental-input --locked
      - run: cargo +1.88.0 test --no-default-features --lib --features incremental-input incremental::tests --locked
      - run: cargo +1.88.0 test --no-default-features --doc --locked
      - run: cargo +1.88.0 check --no-default-features --release --all-targets --locked

  quality:
    name: Quality and package audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check fuzz harnesses and bounded resource profile
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
          cargo check --manifest-path fuzz/Cargo.toml --all-targets --locked
          cargo test --manifest-path fuzz/Cargo.toml --lib --locked
      - name: Audit package contents
        shell: bash
        run: diff -u validation/expected-package-files.txt <(cargo package --list --locked)
      - name: Verify packaged decoder builds
        run: cargo package --locked
      - name: Check image consumer against the unpacked package
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/image-consumer-probe
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 test --locked --manifest-path validation/image-consumer-probe/Cargo.toml
          cargo +1.88.0 check --release --all-targets --locked --manifest-path validation/image-consumer-probe/Cargo.toml
          cargo fmt --manifest-path validation/image-consumer-probe/Cargo.toml --package jpeg2000_image_consumer_probe -- --check
          cargo clippy --all-targets --locked --manifest-path validation/image-consumer-probe/Cargo.toml -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked --manifest-path validation/image-consumer-probe/Cargo.toml
          git diff --exit-code

  native-numerics:
    name: Native numerical (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
            venv: .venv/bin/python
          - os: macos-latest
            python: python3
            venv: .venv/bin/python
          - os: windows-latest
            python: python
            venv: .venv/Scripts/python.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Initialize the pinned crate toolchain
        run: |
          cargo --version
          rustc --version
      - name: Install pinned validation dependencies
        run: |
          ${{ matrix.python }} -m venv .venv
          ${{ matrix.venv }} --version
          ${{ matrix.venv }} -m pip --version
          ${{ matrix.venv }} -m pip install --require-hashes --only-binary=:all: -r validation/requirements.txt
      - name: Build pinned independent reference tools
        run: |
          bash validation/build-openjpeg.sh
          bash validation/build-openjph.sh
      - name: Locate native reference executables
        run: |
          ${{ matrix.venv }} - <<'PY'
          import os
          from pathlib import Path
          suffix = ".exe" if os.name == "nt" else ""
          projects = {
              "OPENJPEG_ENCODER": ("openjpeg-build", "opj_compress"),
              "OPENJPEG_DECODER": ("openjpeg-build", "opj_decompress"),
              "OPENJPH_ENCODER": ("openjph-build", "ojph_compress"),
              "OPENJPH_DECODER": ("openjph-build", "ojph_expand"),
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env, \
               open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as paths:
              for variable, (project, program) in projects.items():
                  candidates = [path for path in (Path("target/validation/oracles") / project).rglob(program + suffix)
                                if path.is_file()]
                  if len(candidates) != 1:
                      raise RuntimeError(f"expected one native executable for {variable}: {candidates}")
                  executable = candidates[0].resolve()
                  print(f"{variable}={executable}", file=env)
                  print(executable.parent, file=paths)
          PY
      - name: Bounded subprocess regression tests
        run: ${{ matrix.venv }} -m unittest -v validation.tests.test_processes
      - name: Independent legacy numerical checks
        run: ${{ matrix.venv }} validation/run-validation.py numerical
      - name: Independent HT numerical checks
        run: ${{ matrix.venv }} validation/run-validation.py htj2k
      - name: Native numerical, selection and container regressions
        run: |
          ${{ matrix.venv }} -m unittest -v \
            validation.tests.test_numerical \
            validation.tests.test_selection \
            validation.tests.test_container_relations
      - name: Verify reports and unchanged tracked source
        run: |
          ${{ matrix.venv }} validation/run-validation.py schemas
          git diff --exit-code
      - name: Upload platform numerical reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-numerics-${{ matrix.os }}
          path: |
            target/validation/numerical-results.json
            target/validation/htj2k-results.json
            target/validation/numerical-failures/**
            target/validation/selection-failures/**
            target/validation/container-failures/**
            target/validation/q2-selection/**
            target/validation/q2-container/**
            target/validation/q2-mixed/**
          if-no-files-found: warn
          retention-days: 14

  decoder-validation:
    name: Generated decoder validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Initialize pinned crate toolchain
        env:
          RUSTUP_HOME: ${{ runner.temp }}/jpeg2000-validation-rustup
        run: |
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          cargo --version
          rustc --version
      - name: Install pinned validation dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r validation/requirements.txt
      - name: Build pinned independent legacy reference tools
        run: |
          bash validation/build-openjpeg.sh
          echo "$GITHUB_WORKSPACE/target/validation/oracles/openjpeg-build/bin" >> "$GITHUB_PATH"
          if [ ! -x /usr/bin/time ]; then
            echo "GNU Time is required for canonical resource validation" >&2
            exit 1
          fi
          /usr/bin/time --version
      - name: Build pinned independent HTJ2K reference tools
        run: |
          bash validation/build-openjph.sh
          echo "$GITHUB_WORKSPACE/target/validation/oracles/openjph-build/src/apps/ojph_compress" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/target/validation/oracles/openjph-build/src/apps/ojph_expand" >> "$GITHUB_PATH"
      - name: Framework regression tests
        run: .venv/bin/python -m unittest discover -s validation/tests -v
        env:
          PYTHONPATH: validation
      - run: .venv/bin/python validation/run-validation.py generate --check
      - run: .venv/bin/python validation/run-validation.py verify
      - run: .venv/bin/python validation/run-validation.py inventory
      - run: .venv/bin/python validation/run-validation.py schemas
      - run: .venv/bin/python validation/run-validation.py all
      - run: .venv/bin/python validation/run-validation.py htj2k
      - run: .venv/bin/python validation/run-validation.py resources
      - name: Check validation did not modify tracked source
        run: git diff --exit-code
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: decoder-validation
          path: |
            target/validation/*.json
            target/validation/numerical-failures/**
            target/validation/selection-failures/**
            target/validation/container-failures/**
            target/validation/resource-failures/**
            target/validation/q2-selection/**
            target/validation/q2-container/**
            target/validation/q2-mixed/**
          if-no-files-found: warn
          retention-days: 14
