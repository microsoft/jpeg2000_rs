name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: cargo test --all-targets --locked
      - run: cargo test --doc --locked
      - run: cargo check --release --all-targets --locked

  msrv:
    name: Minimum supported Rust (1.88.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 test --no-default-features --all-targets --locked
      - run: cargo +1.88.0 test --no-default-features --doc --locked
      - run: cargo +1.88.0 check --no-default-features --release --all-targets --locked

  quality:
    name: Quality and package audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check fuzz harnesses and bounded resource profile
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
          cargo check --manifest-path fuzz/Cargo.toml --all-targets --locked
          cargo test --manifest-path fuzz/Cargo.toml --lib --locked
      - name: Audit package contents
        shell: bash
        run: diff -u validation/expected-package-files.txt <(cargo package --list --locked)
      - name: Verify packaged decoder builds
        run: cargo package --locked
      - name: Check image consumer against the unpacked package
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/image-consumer-probe
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 test --locked --manifest-path validation/image-consumer-probe/Cargo.toml
          cargo +1.88.0 check --release --all-targets --locked --manifest-path validation/image-consumer-probe/Cargo.toml
          cargo fmt --manifest-path validation/image-consumer-probe/Cargo.toml --package jpeg2000_image_consumer_probe -- --check
          cargo clippy --all-targets --locked --manifest-path validation/image-consumer-probe/Cargo.toml -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked --manifest-path validation/image-consumer-probe/Cargo.toml
          git diff --exit-code

  native-numerics:
    name: Native numerical (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
            venv: .venv/bin/python
          - os: macos-latest
            python: python3
            venv: .venv/bin/python
          - os: windows-latest
            python: python
            venv: .venv/Scripts/python.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Initialize the pinned crate toolchain
        run: |
          cargo --version
          rustc --version
      - name: Install pinned validation dependencies
        run: |
          ${{ matrix.python }} -m venv .venv
          ${{ matrix.venv }} --version
          ${{ matrix.venv }} -m pip --version
          ${{ matrix.venv }} -m pip install --require-hashes --only-binary=:all: -r validation/requirements.txt
      - name: Build pinned independent reference tools
        run: |
          bash validation/build-openjpeg.sh
          bash validation/build-openjph.sh
      - name: Locate native reference executables
        run: |
          ${{ matrix.venv }} - <<'PY'
          import os
          from pathlib import Path
          suffix = ".exe" if os.name == "nt" else ""
          projects = {
              "OPENJPEG_ENCODER": ("openjpeg-build", "opj_compress"),
              "OPENJPEG_DECODER": ("openjpeg-build", "opj_decompress"),
              "OPENJPH_ENCODER": ("openjph-build", "ojph_compress"),
              "OPENJPH_DECODER": ("openjph-build", "ojph_expand"),
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env, \
               open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as paths:
              for variable, (project, program) in projects.items():
                  candidates = [path for path in (Path("target/validation/oracles") / project).rglob(program + suffix)
                                if path.is_file()]
                  if len(candidates) != 1:
                      raise RuntimeError(f"expected one native executable for {variable}: {candidates}")
                  executable = candidates[0].resolve()
                  print(f"{variable}={executable}", file=env)
                  print(executable.parent, file=paths)
          PY
      - name: Bounded subprocess regression tests
        run: ${{ matrix.venv }} -m unittest -v validation.tests.test_processes
      - name: Independent legacy numerical checks
        run: ${{ matrix.venv }} validation/run-validation.py numerical
      - name: Independent HT numerical checks
        run: ${{ matrix.venv }} validation/run-validation.py htj2k
      - name: Native numerical, selection and container regressions
        run: |
          ${{ matrix.venv }} -m unittest -v \
            validation.tests.test_numerical \
            validation.tests.test_selection \
            validation.tests.test_container_relations
      - name: Verify reports and unchanged tracked source
        run: |
          ${{ matrix.venv }} validation/run-validation.py schemas
          git diff --exit-code
      - name: Upload platform numerical reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-numerics-${{ matrix.os }}
          path: |
            target/validation/numerical-results.json
            target/validation/htj2k-results.json
            target/validation/numerical-failures/**
            target/validation/selection-failures/**
            target/validation/container-failures/**
            target/validation/q2-selection/**
            target/validation/q2-container/**
            target/validation/q2-mixed/**
          if-no-files-found: warn
          retention-days: 14

  decoder-validation:
    name: Generated decoder validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Initialize pinned crate toolchain
        env:
          RUSTUP_HOME: ${{ runner.temp }}/jpeg2000-validation-rustup
        run: |
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          cargo --version
          rustc --version
      - name: Install pinned validation dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r validation/requirements.txt
      - name: Install independent numerical reference tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libopenjp2-tools time
      - name: Build pinned independent HTJ2K reference tools
        run: |
          bash validation/build-openjph.sh
          echo "$GITHUB_WORKSPACE/target/validation/oracles/openjph-build/src/apps/ojph_compress" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/target/validation/oracles/openjph-build/src/apps/ojph_expand" >> "$GITHUB_PATH"
      - name: Framework regression tests
        run: .venv/bin/python -m unittest discover -s validation/tests -v
        env:
          PYTHONPATH: validation
      - run: .venv/bin/python validation/run-validation.py generate --check
      - run: .venv/bin/python validation/run-validation.py verify
      - run: .venv/bin/python validation/run-validation.py inventory
      - run: .venv/bin/python validation/run-validation.py schemas
      - run: .venv/bin/python validation/run-validation.py all
      - run: .venv/bin/python validation/run-validation.py htj2k
      - run: .venv/bin/python validation/run-validation.py resources
      - name: Check validation did not modify tracked source
        run: git diff --exit-code
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: decoder-validation
          path: |
            target/validation/*.json
            target/validation/numerical-failures/**
            target/validation/selection-failures/**
            target/validation/container-failures/**
            target/validation/resource-failures/**
            target/validation/q2-selection/**
            target/validation/q2-container/**
            target/validation/q2-mixed/**
          if-no-files-found: warn
          retention-days: 14
